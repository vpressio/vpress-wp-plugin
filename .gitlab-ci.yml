stages:
  - lint
  - test
  - build
  - package
  - e2e

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.yarn_cache: &yarn_cache
  cache:
    key:
      files:
        - admin/yarn.lock
    paths:
      - admin/node_modules

lint:js:
  stage: lint
  image: node:24-alpine
  <<: *yarn_cache
  script:
    - yarn --cwd admin install --frozen-lockfile
    # ratchet: lower this number, never raise it. 731 is today's exact
    # warning count (2026-09-24, after merging night/integration and fixing
    # the 2 pre-existing no-undef errors — see the fix(lint) commit); --max-
    # warnings only gates warnings, so a real lint ERROR still fails this
    # job regardless of the ratchet.
    - yarn --cwd admin eslint . --max-warnings 731

lint:php:
  stage: test
  image: php:8.3-cli
  before_script:
    # php:8.3-cli is Debian-based (apt); the conditional keeps this working
    # if that ever changes to an Alpine variant (apk). git is required by
    # bin/php-lint.sh to clone WPCS/PHPCSUtils/PHPCSExtra on first run.
    - if command -v git >/dev/null 2>&1 && command -v curl >/dev/null 2>&1; then true; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq git curl; else apk add --no-cache git curl; fi
  script:
    - bash bin/php-lint.sh --report=full --report-file=phpcs.txt
    - bash bin/php-lint.sh --report=json --report-file=phpcs.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - phpcs.txt
      - phpcs.json
  # Report-only baseline (2990 errors / 908 warnings, measured 2026-09-24,
  # after merging night/integration and re-adding blocks/ to the scan).
  # Flip to `allow_failure: false` once that WPCS backlog is paid down and
  # this job should start blocking merges.
  allow_failure: true

test:js:
  stage: test
  image: node:24-alpine
  <<: *yarn_cache
  script:
    - yarn --cwd admin install --frozen-lockfile
    - yarn --cwd admin vitest run --reporter=default --reporter=junit --outputFile=vitest-junit.xml
  artifacts:
    when: always
    reports:
      junit: admin/vitest-junit.xml

test:php:
  stage: test
  image: php:8.3-cli
  before_script:
    - if command -v curl >/dev/null 2>&1; then true; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq curl; else apk add --no-cache curl; fi
    # bin/phpunit.phar is gitignored (a local dev symlink only); fetch a real
    # copy under the same path so the commands below match local dev 1:1.
    - curl -sL -o bin/phpunit.phar https://phar.phpunit.de/phpunit-11.phar
  script:
    - php bin/phpunit.phar -c tests/php/phpunit.xml --log-junit tests/php/junit-main.xml
    - php bin/phpunit.phar --bootstrap tests/php/bootstrap-figure.php tests/php/FigureTest.php --log-junit tests/php/junit-figure.xml
    - php bin/phpunit.phar --bootstrap tests/php/bootstrap-blocks.php --log-junit tests/php/junit-blocks.xml tests/php/BlocksTest.php
  artifacts:
    when: always
    reports:
      junit:
        - tests/php/junit-main.xml
        - tests/php/junit-figure.xml
        - tests/php/junit-blocks.xml

plugin-check:
  stage: test
  image: wordpress:cli-php8.3
  allow_failure: true
  # admin/dist (the built Vue admin bundle) is not committed to git, and
  # Plugin Check inspects the real plugin tree it would activate — so this
  # needs the `build` job's artifact on disk before the copy step below.
  # `needs` fetches it into this job's workspace; the rsync then carries it
  # into the throwaway WordPress install along with everything else.
  needs:
    - build
  services:
    - mysql:8.0
  variables:
    MYSQL_DATABASE: wp
    MYSQL_ROOT_PASSWORD: root
    WORDPRESS_DB_HOST: mysql
  before_script:
    - apk add --no-cache rsync
  script:
    - wp core download --path=/tmp/wp --allow-root
    - wp config create --path=/tmp/wp --dbname=wp --dbuser=root --dbpass=root --dbhost=mysql --allow-root
    # Wait for the mysql service to accept connections before `wp core
    # install` tries to talk to it. Self-detects which client tool the
    # image actually has: `mysqladmin ping` where available, else `wp db
    # check` (wp-cli's own connectivity probe, no extra package needed) —
    # checked at runtime rather than assumed, since the exact wordpress:cli
    # image contents weren't confirmable in this environment (no working
    # Docker daemon at the time this job was written; see the report).
    - |
      for i in $(seq 1 30); do
        if command -v mysqladmin >/dev/null 2>&1; then
          mysqladmin ping -h mysql -uroot -proot --silent && break
        else
          wp db check --path=/tmp/wp --allow-root >/dev/null 2>&1 && break
        fi
        sleep 2
      done
    - wp core install --path=/tmp/wp --url=http://localhost --title=CI --admin_user=ci --admin_password=ci --admin_email=ci@example.invalid --skip-email --allow-root
    - mkdir -p /tmp/wp/wp-content/plugins/vpress
    - rsync -a --exclude='.git' --exclude='admin/node_modules' --exclude='.worktrees' ./ /tmp/wp/wp-content/plugins/vpress/
    - wp plugin activate vpress --path=/tmp/wp --allow-root
    - wp plugin install plugin-check --activate --path=/tmp/wp --allow-root
    - wp plugin check vpress --path=/tmp/wp --format=table --categories=plugin_repo --allow-root | tee plugin-check.txt
    - '! grep -q ERROR plugin-check.txt'
  artifacts:
    when: always
    paths:
      - plugin-check.txt

build:
  stage: build
  image: node:24-alpine
  <<: *yarn_cache
  script:
    - yarn --cwd admin install --frozen-lockfile
    - yarn --cwd admin build
  artifacts:
    expire_in: 1 week
    paths:
      - admin/dist/

package:
  stage: package
  image: node:24-alpine
  before_script:
    - apk add --no-cache bash rsync zip
  script:
    - bash bin/build-release.sh
  artifacts:
    expire_in: 1 month
    paths:
      - build/*.zip
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual

# Playwright end-to-end smoke suite (admin/tests/e2e). Skipped unless the CI
# variable E2E_BASE_URL points at a WordPress instance with Vpress active and
# the vpress_test_ventas dataset + chart #1 seeded. E2E_USER / E2E_PASSWORD
# (masked CI variables, read from the environment by login.setup.js) are the
# WordPress login; they win over any credentials file.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  rules:
    - if: $E2E_BASE_URL
  before_script:
    # The Playwright image ships Node; Yarn classic may not be on PATH.
    - command -v yarn || npm install -g yarn
  script:
    - yarn --cwd admin install --frozen-lockfile
    - yarn --cwd admin test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - admin/playwright-report/
      - admin/test-results/
      - admin/tests/e2e/screenshots/
